apply plugin: 'com.android.application'

android {
    compileSdkVersion 28
    buildToolsVersion "28.0.3"

    defaultConfig {
        applicationId "org.lgames.lpairs2"
        minSdkVersion 17
        targetSdkVersion 17
        versionCode 20303
        versionName "2.3.2-android4"

        ndk {
            abiFilters "armeabi-v7a"
        }

        externalNativeBuild {
            ndkBuild {
                arguments "APP_PLATFORM=android-17"
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    sourceSets {
        main {
            // SDL 2.0.7 uses the pre-Gradle Android project Java glue.
            java.srcDirs += ["../third_party/SDL2/android-project/src"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }

    buildTypes {
        debug {
            jniDebuggable true
        }
        release {
            minifyEnabled false
        }
    }
}
