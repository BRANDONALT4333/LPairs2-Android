plugins {
    id 'com.android.application'
}

android {
    namespace 'org.lgames.lpairs2'
    compileSdk 35

    defaultConfig {
        applicationId 'org.lgames.lpairs2'
        minSdk 21
        targetSdk 35
        versionCode 20302
        versionName '2.3.2'

        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=c++_shared' }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    // SDL's Java glue (SDLActivity etc.) comes straight from the SDL2 source
    // tree fetched by setup_sdl.sh so it always matches the native library.
    sourceSets {
        main {
            java.srcDirs += ['../third_party/SDL2/android-project/app/src/main/java']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
