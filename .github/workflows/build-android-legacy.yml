name: Build Android 4.2.2 (legacy)

on:
  push:
    branches: [android-4.2.2]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Current Android command-line tools require Java 17.
      - name: Set up Java 17 for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install legacy Android build tools
        run: |
          sdkmanager --install "platforms;android-28" "build-tools;28.0.3" "ndk;15.2.4203891"
          yes | sdkmanager --licenses

      # The legacy Gradle 4.6 build runs on Java 8.
      - name: Set up Java 8 for legacy Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Download SDL 2.0.7 and compatible add-ons
        run: bash ./setup_sdl_legacy.sh

      - name: Build API 17 ARMv7 APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Upload legacy APK
        uses: actions/upload-artifact@v4
        with:
          name: lpairs2-android-4.2.2-armv7-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
