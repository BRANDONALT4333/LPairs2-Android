name: Build Android 4.2.2 (legacy)

on:
  push:
    branches: [android-4.2.2]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17 for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install legacy Android build tools
        run: |
          sdkmanager --install "platforms;android-28" "build-tools;28.0.3"
          yes | sdkmanager --licenses

      - name: Install Android NDK r15c
        run: |
          curl -fL --retry 3 https://dl.google.com/android/repository/android-ndk-r15c-linux-x86_64.zip -o /tmp/android-ndk.zip
          mkdir -p "$ANDROID_SDK_ROOT/ndk"
          unzip -q /tmp/android-ndk.zip -d "$ANDROID_SDK_ROOT/ndk"
          mv "$ANDROID_SDK_ROOT/ndk/android-ndk-r15c" "$ANDROID_SDK_ROOT/ndk/15.2.4203891"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/15.2.4203891" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/ndk/15.2.4203891" >> "$GITHUB_PATH"

      - name: Set up Java 8 for legacy Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Download SDL 2.0.7 and compatible add-ons
        run: bash ./setup_sdl_legacy.sh

      - name: Build API 17 ARMv7 APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Upload legacy APK
        uses: actions/upload-artifact@v4
        with:
          name: lpairs2-android-4.2.2-armv7-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
